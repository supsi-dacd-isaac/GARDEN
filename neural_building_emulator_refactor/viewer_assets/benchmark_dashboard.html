rder-radius:11px;padding:17px;box-shadow:0 2px 3px #142a4304}.stat{font-size:29px;font-weight:650;line-height:1.4}.statlabel{font-size:12px;color:var(--muted)}.chart{width:100%;height:310px}.tall{height:420px}.notice{padding:13px 16px;border-left:3px solid #7c9fc7;background:#e9f0f8;border-radius:0 8px 8px 0;font-size:14px;margin:16px 0}.finding{padding:16px;background:white;border:1px solid var(--line);border-radius:10px}.finding strong{display:block;margin-bottom:7px}.tablewrap{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:9px 11px;border-bottom:1px solid #e7ecf2;text-align:right}th{font-weight:600;background:#f8fafc}td:first-child,th:first-child{text-align:left}tr:last-child td{border:0}a{color:#245c9a;text-decoration:none}a:hover{text-decoration:underline}.pill{font-size:12px;border:1px solid #bad0e8;border-radius:20px;padding:3px 9px;display:inline-block;color:#27527e}.plot-title{font-size:14px;font-weight:650;line-height:1.5}.notes li{margin:9px 0}.download{display:inline-block;padding:8px 12px;border:1px solid #c5d4e5;background:white;border-radius:7px;margin:3px 6px 3px 0}details summary{cursor:pointer;font-weight:600;margin-bottom:10px}#busy{font-size:12px;color:var(--muted);margin-left:auto}.error{color:#b72d41;white-space:pre-wrap}footer{margin-top:28px;font-size:12px;color:var(--muted)}

</style></head><body>
<header><div class="eyebrow">GARDEN / Ticino / v9-final</div><h1>1,000-building model review</h1><p>Four neural emulators and the LightGBM KPI benchmark. Matched annual test trajectories, native uncertainty, flexibility calibration, and transfer to tariff controls.</p></header>
<main><div class="controls"><div class="controlrow">
<label>Evaluation policy<select id="policy"></select></label>
<label>Signal for detailed plots<select id="signal"><option value="Tin">Indoor temperature · Tin</option><option value="Qroom">Delivered room heat · Qroom</option><option value="Pel_SH">HP electric power · Pel</option></select></label>
<label>Flexibility definition<select id="kind"><option value="f">Direct F</option><option value="regression">Regression-based</option></select></label>
<label>KPI distribution<select id="cal"><option value="raw">Native / raw</option><option value="rns">RNS</option><option value="rns_ecc">RNS–ECC</option></select></label><span id="busy"></span>
</div><nav class="tabs" id="tabs"></nav></div><div class="legend" id="legend"></div><div id="content"></div><footer id="footer"></footer></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id),M=D.models,MS=D.methods,P=D.policies,C=D.colors,L=D.labels,PL=D.policyLabels;
const short={baseline:'Base',two_tanks:'2 tanks',continuous:'LSTM',hurdle_markov:'Markov',lightgbm:'LGBM'},S=['Tin','Qroom','Pel_SH'],SN={Tin:'Indoor temperature',Qroom:'Delivered room heat',Pel_SH:'HP electric power'},units={Tin:'°C',Qroom:'W/m²',Pel_SH:'W/m²'},tabs={overview:'Overview',traces:'Trace accuracy & uncertainty',temporal:'Temporal behaviour',kpi:'Flexibility KPIs',joint:'Joint KPI scores',transfer:'Policy transfer',sources:'Data & methodology'};
let active='overview',tasks=[],counter=0;
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN,fmt=(n,d=3)=>n==null||!Number.isFinite(+n)?'—':Number(n).toFixed(d),pct=n=>fmt(100*n,1)+'%',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pol=()=>$('policy').value,sig=()=>$('signal').value,cal=()=>$('cal').value,off=()=>pol().includes('force_off'),kind=()=>off()?($('kind').value==='f'?'force_off_f':'force_off_regression'):($('kind').value==='f'?'f':'regression_based'),unitK=()=>off()?'Wh/(m² intervention)':'Wh/(m² K)';
const rows=(name,filters={})=>(D[name]||[]).filter(r=>Object.entries(filters).every(([k,v])=>r[k]===v));
const tr=(signal=sig())=>rows('trace_summary',{policy:pol(),signal}),ks=(calibration=cal())=>rows('kpi_summary',{policy:pol(),kpi_kind:kind(),calibration});
function card(title,id,cls=''){return `<div class="card"><div class="plot-title">${title}</div><div id="${id}" class="chart ${cls}"></div></div>`}
function table(headers,body){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function section(html){$('content').innerHTML=html}
function plot(id,data,layout={}){let base={font:{family:'system-ui, sans-serif',size:12,color:'#34475e'},paper_bgcolor:'white',plot_bgcolor:'white',margin:{l:56,r:18,t:20,b:56},hovermode:'closest',showlegend:false,legend:{orientation:'h',y:-.25,font:{size:10}},xaxis:{automargin:true,gridcolor:'#edf1f6',zerolinecolor:'#d6dfe9'},yaxis:{automargin:true,gridcolor:'#edf1f6',zerolinecolor:'#d6dfe9'},...layout};tasks.push(Plotly.newPlot(id,data,base,{responsive:true,displaylogo:false,modeBarButtonsToRemove:['lasso2d','select2d'],toImageButtonOptions:{format:'svg',filename:'garden_'+active+'_'+id}}))}
function line(data,keyX,keyY,method,opts={}){return {type:'scatter',mode:'lines+markers',x:data.map(r=>r[keyX]),y:data.map(r=>r[keyY]),name:L[method]||method,line:{color:C[method]||'#172c42',width:2},marker:{size:5},...opts}}
function diag(){return {type:'scatter',mode:'lines',x:[0,1],y:[0,1],line:{color:'#8796a9',dash:'dash',width:1},hoverinfo:'skip',name:'Ideal'}}
function bars(id,data,key,ytitle='',target=null,ci=false){const ordered=MS.filter(m=>data.some(r=>r.method===m)),part=ordered.map(m=>data.find(r=>r.method===m));let trace={type:'bar',x:ordered.map(m=>short[m]),y:part.map(r=>r[key]),marker:{color:ordered.map(m=>C[m])},customdata:part.map(r=>[L[r.method],r[key]]),hovertemplate:'%{customdata[0]}<br>%{y:.4g}<extra></extra>'};if(ci&&part.every(r=>r[key+'_lo']!=null))trace.error_y={type:'data',symmetric:false,array:part.map(r=>r[key+'_hi']-r[key]),arrayminus:part.map(r=>r[key]-r[key+'_lo']),color:'#435368',thickness:1.2};let layout={yaxis:{title:ytitle,gridcolor:'#edf1f6',rangemode:'tozero'}};if(target!=null){layout.shapes=[{type:'line',xref:'paper',x0:0,x1:1,y0:target,y1:target,line:{color:'#34475e',dash:'dash',width:1}}];layout.yaxis.range=[0,1.03]}plot(id,[trace],layout)}
function reliability(id,data,groupKey='method'){plot(id,[diag(),...M.filter(m=>data.some(r=>r.method===m)).map(m=>{const g=data.filter(r=>r.method===m);const q=[...new Set(g.map(r=>r.quantile))].sort((a,b)=>a-b);return line(q.map(quantile=>({quantile,empirical_coverage:mean(g.filter(r=>r.quantile===quantile).map(r=>r.empirical_coverage))})),'quantile','empirical_coverage',m)})],{xaxis:{title:'Nominal quantile',range:[0,1],dtick:.2},yaxis:{title:'Observed fraction below quantile',range:[0,1],dtick:.2}})}
function heat(id,x,y,z,opts={}){plot(id,[{type:'heatmap',x,y,z:opts.percent?z.map(r=>r.map(v=>v==null?null:Math.abs(v-.9))):z,customdata:z,colorscale:opts.colorscale||[[0,'#9cd3bf'],[.2,'#e9efd8'],[.5,'#f6d5ae'],[1,'#d88585']],zmin:opts.zmin??0,zmax:opts.zmax??.4,text:z.map(r=>r.map(v=>v==null?'—':(opts.percent?fmt(v*100,1)+'%':fmt(v,2)))),texttemplate:'%{text}',textfont:{size:12},hovertemplate:'%{y}<br>%{x}: %{customdata:.4g}<extra></extra>',colorbar:{thickness:10,len:.8},showscale:opts.showscale??false}],{margin:{l:135,r:15,t:15,b:55},xaxis:{automargin:true},yaxis:{autorange:'reversed',automargin:true},...opts.layout})}
function overview(){const set=ks('raw'),best=set.reduce((a,b)=>a.crps<b.crps?a:b),coverage=S.map(s=>tr(s));section(`<div class="grid four"><div class="card"><div class="stat">701 / 100</div><div class="statlabel">training / validation buildings</div></div><div class="card"><div class="stat">99 / 100</div><div class="statlabel">calibration / matched test buildings</div></div><div class="card"><div class="stat">100 × year</div><div class="statlabel">particles per test building and model</div></div><div class="card"><div class="stat">15 epochs</div><div class="statlabel">all neural models; validation-selected checkpoints</div></div></div>
<h2>${PL[pol()]}</h2><p class="muted">The same 100 test buildings are used across all four policies. Error bars on CRPS resample buildings, keeping each building’s horizons together.</p>
<div class="grid">${card('Native trace CRPS / structured baseline','ovtrace')}${card('Native '+($('kind').value==='f'?'direct-F':'regression KPI')+' CRPS','ovkpi')}${card('Native 90% calibration','ovcov')}</div>
<div class="grid"><div class="finding"><strong>Best native ${$('kind').value==='f'?'direct-F':'regression KPI'} CRPS here</strong>${L[best.method]}: <b>${fmt(best.crps)}</b> ${unitK()}, with ${pct(best.coverage_90)} coverage of its nominal 90% interval. See the paired differences before treating close rankings as decisive.</div><div class="finding"><strong>Trace calibration remains uneven</strong>Across the neural models: Tin ${pct(Math.min(...coverage[0].map(r=>r.coverage_90)))}–${pct(Math.max(...coverage[0].map(r=>r.coverage_90)))}, Qroom ${pct(Math.min(...coverage[1].map(r=>r.coverage_90)))}–${pct(Math.max(...coverage[1].map(r=>r.coverage_90)))}. Compare interval width and CRPS alongside coverage.</div><div class="finding"><strong>Recalibration can fail under transfer</strong>For two tanks on tariff force-off, direct-F CRPS changes from 0.412 raw to 0.653 after RNS/ECC; 90% coverage falls from 89.0% to 74.2%. The calibration fit uses only excitation buildings and policies.</div></div>
<div class="notice">LightGBM predicts KPIs from metadata; it produces no Tin/Qroom/Pel traces and receives no temporal policy inputs. RNS and RNS–ECC have identical marginal scores; only their joint KPI dependence differs. Neither recalibrates the annual traces.</div>
<div class="card"><h3>Selected checkpoints</h3>${table(['Model','Epoch selected','Training budget'],M.map(m=>[L[m],D.epochs[m].selected_epoch,15]))}</div>`);
plot('ovtrace',S.map(s=>({type:'bar',name:s,x:M.map(m=>short[m]),y:M.map(m=>{let a=tr(s);return a.find(r=>r.method===m).mean_crps/a.find(r=>r.method==='baseline').mean_crps}),customdata:M.map(m=>tr(s).find(r=>r.method===m).mean_crps),hovertemplate:s+'<br>relative CRPS=%{y:.3f}<br>absolute=%{customdata:.4g} '+units[s]+'<extra></extra>'})),{barmode:'group',showlegend:true,yaxis:{title:'Ratio to baseline · lower is better'},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:1,y1:1,line:{dash:'dash',width:1,color:'#71829a'}}]});bars('ovkpi',set,'crps',unitK(),null,true);heat('ovcov',['Tin','Qroom','Pel','KPI'],M.map(m=>short[m]),M.map(m=>[...S.map(s=>tr(s).find(r=>r.method===m).coverage_90),set.find(r=>r.method===m).coverage_90]),{percent:true,layout:{margin:{l:65,r:10,t:20,b:40}}})}
function traces(){section(`<h2>Native annual traces · ${PL[pol()]}</h2><p class="muted">Accuracy uses the ensemble mean and gives each building equal weight. Trace CRPS, width and rank calibration use all annual timestamps for Tin, and heating-available timestamps for Qroom and Pel. These are pointwise predictive distributions, not simultaneous whole-year confidence bands.</p>
<div class="grid">${S.map(s=>card(s+' · mean building RMSE ('+units[s]+')','acc'+s)).join('')}</div>
<div class="grid">${S.map(s=>card(s+' · native CRPS ('+units[s]+')','crps'+s)).join('')}</div>
<div class="grid">${S.map(s=>card(s+' · central rank 90% coverage','cov'+s)).join('')}</div>
<h2>${SN[sig()]} · distribution diagnostics</h2><div class="grid">${card('Quantile reliability · diagonal is ideal','rel')}${card('Tie-aware rank histogram · flat is ideal','pit')}${card('Sharpness and 90% coverage','sharp')}</div>
<div class="card"><h3>${sig()} · detailed scores</h3>${table(['Model','RMSE','MAE','Bias','CRPS','Rank coverage 90%','Mean width 90%','Calibration MAE'],tr().map(r=>[L[r.method],fmt(r.rmse),fmt(r.mae),fmt(r.bias),fmt(r.mean_crps),pct(r.coverage_90),fmt(r.mean_central_90_width),fmt(r.calibration_mae)]))}</div>
<p class="caption">RMSE error bars: 95% bootstrap intervals over 100 buildings. CRPS / coverage are pooled saved statistics; no timestamp-independence confidence intervals are drawn. Rank coverage handles the atom at zero for Qroom/Pel and is not identical to literal interval-hit coverage at tied values.</p>`);
for(const s of S){bars('acc'+s,tr(s),'rmse',units[s],null,true);bars('crps'+s,tr(s),'mean_crps',units[s]);bars('cov'+s,tr(s),'coverage_90','Observed rank coverage',.9)}
reliability('rel',rows('trace_reliability',{policy:pol(),signal:sig()}));plot('pit',M.map(m=>line(rows('trace_histogram',{policy:pol(),signal:sig(),method:m}),'bin_center','probability',m)),{xaxis:{title:'Randomized ensemble rank',range:[0,1]},yaxis:{title:'Probability per decile',rangemode:'tozero'},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:.1,y1:.1,line:{color:'#8997a8',dash:'dash'}}]});plot('sharp',tr().map(r=>({type:'scatter',mode:'markers+text',x:[r.mean_central_90_width],y:[r.coverage_90],text:[short[r.method]],textposition:'top center',name:L[r.method],marker:{color:C[r.method],size:12},hovertemplate:L[r.method]+'<br>width=%{x:.3f}<br>coverage=%{y:.3f}<extra></extra>'})),{xaxis:{title:'Mean 90% width ('+units[sig()]+')',rangemode:'tozero'},yaxis:{title:'90% rank coverage',range:[.3,1.03]},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:.9,y1:.9,line:{color:'#777',dash:'dash'}}]})}
function temporal(){if(off()){temporalOff();return}const summary=rows('hp_dynamics_summary',{policy:pol()});section(`<h2>Memory, fluctuations and HP cycling · ${PL[pol()]}</h2><p class="muted">The first row describes the <b>ensemble-mean ${sig()} trace</b>. The HP cycling plots below describe individual sampled paths, so they are not smoothed away by averaging particles.</p><div class="grid">${card(sig()+' · autocorrelation error (0.25–24 h)','acfmean')}${card(sig()+' · increment spectral distance','spectral')}${card(sig()+' · normalized Wasserstein distance','wasserstein')}</div>
<h2>Sampled HP operation</h2><div class="grid">${card('HP on/off autocorrelation','modeacf')}${card('HP on-run duration distribution','runlength')}${card('Annual HP energy · reliability','annualrel')}</div><div class="grid two">${card('HP start probability · reliability','start')}${card('HP stay-on probability · reliability','stay')}</div>
<div class="card"><h3>HP diagnostics</h3>${table(['Model','Mean on-run (h)','Truth on-run (h)','Run distribution TV ↓','Mode ACF RMSE ↓','Start Brier ↓','Stay-on Brier ↓','Annual-energy calibration MAE ↓'],summary.map(r=>[L[r.method],fmt(r.pel_scenario_mean_run_hours),fmt(r.pel_truth_mean_run_hours),fmt(r.pel_run_duration_total_variation),fmt(r.pel_mode_acf_rmse),fmt(r.pel_start_brier),fmt(r.pel_stay_on_brier),fmt(r.pel_annual_energy_calibration_mae)]))}</div>
<p class="caption">Mean-trace ACF/spectral mismatch is not a test of the path ensemble’s temporal dependence: the ensemble mean smooths stochastic switching. HP start/stay diagnostics condition on the observed previous mode for scoring; inference remains autonomous. Qroom/Pel are zero-thresholded at 0.05 W/m² for switching/rank diagnostics. Annual-energy calibration has 100 observations, one per building.</p>`);
bars('acfmean',tr(),'acf_mae','Mean absolute ACF error');bars('spectral',tr(),'increment_spectral_js','Normalized JS distance');bars('wasserstein',tr(),'wasserstein_norm','Wasserstein / training scale');let ac=rows('pel_mode_autocorrelation',{policy:pol()}),a0=ac.filter(r=>r.method==='baseline');plot('modeacf',[line(a0,'lag_hours','truth_acf','EnergyPlus',{line:{color:'#1e2f43',width:3,dash:'dash'}}),...M.map(m=>line(ac.filter(r=>r.method===m),'lag_hours','scenario_mean_acf',m))],{xaxis:{title:'Lag (h)'},yaxis:{title:'On/off mode ACF'},showlegend:false});let rr=rows('pel_run_duration_distribution',{policy:pol()});plot('runlength',[{type:'scatter',mode:'lines',name:'EnergyPlus',x:rr.filter(r=>r.method==='baseline'&&r.signal==='simulation').map(r=>r.bin_label),y:rr.filter(r=>r.method==='baseline'&&r.signal==='simulation').map(r=>r.probability),line:{color:'#1e2f43',dash:'dash',width:3}},...M.map(m=>line(rr.filter(r=>r.method===m&&r.signal!=='simulation'),'bin_label','probability',m))],{xaxis:{title:'On-run duration (h)',tickangle:-45},yaxis:{title:'Fraction of runs'},margin:{l:50,r:10,t:20,b:90}});reliability('annualrel',rows('pel_annual_energy_calibration',{policy:pol()}));for(const [id,transition] of [['start','start_given_observed_off'],['stay','stay_on_given_observed_on']]){let r=rows('pel_transition_reliability',{policy:pol(),transition});plot(id,[diag(),...M.map(m=>line(r.filter(a=>a.method===m&&a.observation_count>0),'predicted_probability','observed_frequency',m))],{xaxis:{title:'Predicted probability',range:[0,1]},yaxis:{title:'Observed frequency',range:[0,1]}})}}
function temporalOff(){const reg=rows('regime_summary',{policy:pol(),signal:sig()}),regimes=[...new Set(reg.map(r=>r.regime))],rnames={winter:'Winter',heating_available_no_lockout:'Available, no lockout',active_lockout:'Lockout',winter_active_lockout:'Winter lockout',post_release_0_3h:'Release +0–3h',post_release_0_12h:'Release +0–12h',post_release_0_24h:'Release +0–24h'};section(`<h2>Force-off and recovery · ${PL[pol()]}</h2><p class="muted">Conditioning on lockout and release exposes behaviour that an annual average can hide. Windows overlap; the recovery windows are scored during heating availability.</p><div class="grid">${card(sig()+' · CRPS by operating period','regcrps','tall')}${card(sig()+' · 90% rank coverage by period','regcov','tall')}${card(sig()+' · 90% width by period','regwidth','tall')}</div><h2>Mean response following force-off onset</h2><p class="muted">Dashed black is EnergyPlus. Each building is weighted equally after averaging its events. Time zero is <b>force-off onset</b>; event durations differ, so this plot is not aligned to release.</p><div class="grid">${card('Indoor temperature minus setpoint','evtTin_minus_Tset')}${card('Delivered room heat','evtQroom')}${card('HP electric power','evtPel_SH')}</div><div class="notice">The force-off evaluator saved conditional uncertainty and event-response curves, but did not save the same ACF/spectral/cycling diagnostics as the setpoint evaluator. Those missing metrics are not inferred from the five plotted example buildings.</div>`);
for(const [id,key,label] of [['regcrps','mean_crps',units[sig()]],['regcov','coverage_90','90% rank coverage'],['regwidth','mean_central_90_width',units[sig()]]]){plot(id,M.map(m=>line(reg.filter(r=>r.method===m).map(r=>({...r,label:rnames[r.regime]})),'label',key,m)),{xaxis:{tickangle:-40},yaxis:{title:label,...(key==='coverage_90'?{range:[0,1.03]}:{rangemode:'tozero'})},margin:{l:55,r:10,t:20,b:140},...(key==='coverage_90'?{shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:.9,y1:.9,line:{dash:'dash',color:'#777'}}]}:{})})}
for(const s of ['Tin_minus_Tset','Qroom','Pel_SH']){let r=rows('event_curves',{policy:pol(),signal:s}),truth=r.filter(a=>a.method==='baseline'&&a.source==='simulation');plot('evt'+s,[line(truth,'lag_hours','mean','EnergyPlus',{line:{color:'#1e2f43',dash:'dash',width:3}}),...M.map(m=>line(r.filter(a=>a.method===m&&a.source!=='simulation'),'lag_hours','mean',m))],{xaxis:{title:'Hours since force-off onset'},yaxis:{title:s==='Tin_minus_Tset'?'°C':'W/m²'}})}}

function joint(){const r=rows('joint_scores',{policy:pol()});section(`<h2>Joint flexibility distributions · ${PL[pol()]}</h2><p class="muted">${off()?'8':'16'} KPI coordinates combine both definitions and all horizons within this policy. Coordinates are standardized using calibration targets. Lower energy and variogram scores are better.</p><div class="grid">${card('Energy score · multivariate calibration / sharpness','energy','tall')}${card('Variogram score · cross-KPI relationships','variogram','tall')}${card('Departure from raw rank copula','copula','tall')}</div><div class="notice">ECC preserves calibrated marginals and the raw rank dependence. A copula distance of zero means it preserves that dependence, not that the dependence is correct. LightGBM’s aligned synthetic quantile samples do not constitute a learned joint trajectory distribution; its scores are displayed as a reference only.</div><div class="card">${table(['Model','Distribution','Energy score','Variogram score','Raw-rank copula RMSE'],r.map(a=>[L[a.method],a.calibration,fmt(a.energy_score),fmt(a.variogram_score,4),fmt(a.raw_rank_copula_rmse)]))}</div>`);for(const [id,key] of [['energy','energy_score'],['variogram','variogram_score'],['copula','raw_rank_copula_rmse']])plot(id,['raw','rns','rns_ecc'].map((c,i)=>({type:'bar',name:['Raw','RNS','RNS–ECC'][i],x:MS.map(m=>short[m]),y:MS.map(m=>r.find(a=>a.method===m&&a.calibration===c)[key]),marker:{color:['#b2c2d5','#6b8eb7','#244f84'][i]}})),{barmode:'group',showlegend:true,yaxis:{rangemode:'tozero'}})}
function transfer(){section(`<h2>Transfer to tariff controls</h2><p class="muted">Each tariff dataset is compared with its corresponding excitation family. These are the same buildings but different interventions: a CRPS ratio measures score change, not a causal measure of distribution shift or policy value.</p><div class="grid two">${card('Tariff / excitation trace CRPS · '+sig(),'ttrace','tall')}${card('Tariff / excitation KPI CRPS · '+$('kind').selectedOptions[0].text,'tkpi','tall')}</div><div class="grid two">${card('Native tariff KPI CRPS','traw','tall')}${card('RNS–ECC tariff KPI CRPS','tcal','tall')}</div><div class="grid two">${card('Native tariff 90% KPI coverage','trawcov')}${card('RNS–ECC tariff 90% KPI coverage','tcalcov')}</div><div class="notice">No tariff fitting or tariff-specific recalibration was performed. LightGBM uses metadata only, so its large transfer gap also reflects missing policy inputs, not just an architectural comparison. Do not rank model families by averaging across differently scaled KPI definitions.</div>`);
const pairs=[['setpoint_excitation_v2','tariff_setpoint_v2'],['force_off_excitation_v2','tariff_force_off_v2']],getkind=p=>p.includes('force_off')?($('kind').value==='f'?'force_off_f':'force_off_regression'):($('kind').value==='f'?'f':'regression_based');plot('ttrace',pairs.map(([src,dst],i)=>({type:'bar',name:i?'Force-off':'Setpoint',x:M.map(m=>short[m]),y:M.map(m=>rows('trace_summary',{policy:dst,method:m,signal:sig()})[0].mean_crps/rows('trace_summary',{policy:src,method:m,signal:sig()})[0].mean_crps),marker:{color:i?'#305f99':'#a8bbd3'}})),{barmode:'group',showlegend:true,yaxis:{title:'Tariff / excitation · <1 is lower'},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:1,y1:1,line:{dash:'dash',color:'#777'}}]});plot('tkpi',pairs.map(([src,dst],i)=>({type:'bar',name:i?'Force-off':'Setpoint',x:MS.map(m=>short[m]),y:MS.map(m=>rows('kpi_summary',{policy:dst,method:m,kpi_kind:getkind(dst),calibration:cal()})[0].crps/rows('kpi_summary',{policy:src,method:m,kpi_kind:getkind(src),calibration:cal()})[0].crps),marker:{color:i?'#305f99':'#a8bbd3'}})),{barmode:'group',showlegend:true,yaxis:{title:'Tariff / excitation · '+cal()},shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:1,y1:1,line:{dash:'dash',color:'#777'}}]});for(const [id,c,key] of [['traw','raw','crps'],['tcal','rns_ecc','crps'],['trawcov','raw','coverage_90'],['tcalcov','rns_ecc','coverage_90']]){let rr=pairs.map(a=>a[1]);plot(id,rr.map((p,i)=>({type:'bar',name:i?'Tariff force-off':'Tariff setpoint',x:MS.map(m=>short[m]),y:MS.map(m=>rows('kpi_summary',{policy:p,method:m,kpi_kind:getkind(p),calibration:c})[0][key]),marker:{color:i?'#305f99':'#a8bbd3'}})),{barmode:'group',showlegend:true,yaxis:{title:key==='crps'?'CRPS · units differ by policy':'Coverage',...(key==='coverage_90'?{range:[0,1.03]}:{rangemode:'tozero'})},...(key==='coverage_90'?{shapes:[{type:'line',xref:'paper',x0:0,x1:1,y0:.9,y1:.9,line:{dash:'dash',color:'#777'}}]}:{})})}}
function sources(){const files=['trace_summary','trace_by_building','trace_reliability','trace_histogram','regime_summary','event_curves','hp_dynamics_summary','kpi_summary','kpi_cells','kpi_reliability','joint_scores','native_paired_crps'];section(`<h2>Download and audit</h2><p><a class="download" href="benchmark_summary.pdf">Five-page PDF summary</a><a class="download" href="native_trace_accuracy.png">Trace RMSE · PNG</a><a class="download" href="native_trace_crps.png">Trace CRPS · PNG</a><a class="download" href="native_trace_coverage.png">Trace coverage · PNG</a><a class="download" href="kpi_f_overview.png">Direct-F summary · PNG</a><a class="download" href="kpi_regression_overview.png">Regression KPI summary · PNG</a></p><div class="card"><h3>Reusable data</h3>${files.map(f=>`<a class="download" href="${f}.csv">${f}.csv</a>`).join('')}<p><a href="provenance.json">Source file fingerprints and scoring definitions</a> · <a href="summary_data.json">Dashboard data</a> · <a href="build_report.py">Rebuild script</a></p></div>
<h2>Reading the comparisons correctly</h2><div class="card"><ul class="notes"><li><b>Matched evaluation:</b> 701 training, 100 validation, 99 calibration and 100 test buildings; 100 particles per annual rollout. Training uses the two excitation policies. Both tariff policies use frozen models and source-fitted calibration.</li><li><b>Training budget:</b> all neural models completed 15 epochs. Baseline and two tanks select epoch 13; vanilla LSTM selects 15; Markov LSTM selects 14. Selection uses validation data, not the displayed test scores.</li><li><b>Trace accuracy:</b> mean of each building’s annual RMSE / MAE / signed bias, using the ensemble-mean trace. This differs from pooling squared residuals before taking one RMSE.</li><li><b>Trace probabilistic scores:</b> empirical ensemble CRPS and mean central interval width. Tin uses all timestamps; Qroom and Pel use heating availability. The central 90% rank coverage is the difference between the 0.95 and 0.05 randomized-rank CDF values. Ties at zero are handled explicitly. It is not literal interval-hit coverage for zero-inflated power.</li><li><b>Time dependence:</b> mean-trace ACF, increment spectra and distribution distances are distinct from sampled-path HP cycling. Full cycling diagnostics exist for the setpoint evaluators; conditional lockout/recovery diagnostics and event curves exist for force-off. Overlapping recovery windows must not be summed.</li><li><b>Flexibility:</b> each horizon/direction cell gets equal weight; prediction accuracy uses the ensemble median. KPI coverage uses physical central intervals. Setpoint KPIs have units Wh/(m² K), force-off KPIs Wh/(m² intervention). Regression and direct-F are separate estimators.</li><li><b>Recalibration:</b> RNS/RNS–ECC adjust KPI ensembles only. The neural time traces and their confidence bands stay native. RNS and ECC have equal marginals, while ECC restores raw particle rank dependence within each policy. Different policy families are not joined by arbitrary particle labels.</li><li><b>Uncertainty in the comparison:</b> RMSE and CRPS error bars use 2,000 bootstrap resamples of buildings. All cells of one building stay together. No false precision from treating millions of correlated timestamps as independent; no claim about variation across training seeds.</li><li><b>LightGBM scope:</b> metadata-only KPI predictions, no traces, no temporal controls. Its synthetic marginal samples do not learn a joint path copula. Transfer gaps therefore also test missing input information.</li><li><b>Scope:</b> one training seed; this test set has been inspected during the research process and is not a pristine final holdout. No models or scores were changed to create this report.</li></ul></div>
<h2>Annual traces with native confidence bands · ${PL[pol()]}</h2><div class="grid two">${M.map(m=>`<div class="card"><h3>${L[m]}</h3><ul>${D.links.filter(l=>l.policy===pol()&&l.method===m).map(l=>`<li><a href="${esc(l.file)}">${esc(l.title)}</a></li>`).join('')}</ul></div>`).join('')}</div>`)}
